name: GitHub Secrets Demo Workflow

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows you to manually run this workflow from the Actions tab on GitHub

jobs:
  run-secret-demo:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Snyk CLI
      - name: Install Snyk CLI
        run: npm install -g snyk

      # Step 5: Authenticate with Snyk using GitHub Secret
      - name: Authenticate with Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth $SNYK_TOKEN

      # Step 6: Run Snyk test on the repository
      - name: Run Snyk Security Test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --severity-threshold=high || true
          echo "✅ Snyk security test completed"
